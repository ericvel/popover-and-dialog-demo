<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Popover API demo</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/index.css" />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body>
    <header>
      <nav>
        <a class="navlink" href="/">Home</a>
        <a class="navlink" href="/">Articles</a>
        <a class="navlink" href="/">Docs</a>
        <button class="user-button" popovertarget="user-menu">
          <img src="/src/user_icon.jpg" class="user-icon" />
        </button>
      </nav>

      <div popover id="user-menu" class="user-menu">
        <div class="name-container">
          <p class="name">Eric Veliyulin</p>
          <span class="email">eric.vel@outlook.com</span>
        </div>
        <a class="menu-item" href="/">Profile</a>
        <a class="menu-item" href="/">Settings</a>
        <button class="menu-item">Sign out</button>
      </div>
    </header>

    <main>
      <h1><code>&lt;dialog&gt;</code> demo</h1>

      <button class="button" id="show-dialog-btn">Show dialog</button>

      <dialog closedby="any">
        <h2>This is a dialog</h2>
        <p>Congrats, you successfully opened the dialog!</p>
        <div class="dialog-footer">
          <button class="button" id="close-dialog-btn">Close</button>
        </div>
      </dialog>
    </main>
  </body>

  <script>
    const dialog = document.querySelector("dialog");
    const showButton = document.querySelector("#show-dialog-btn");
    const closeButton = document.querySelector("#close-dialog-btn");

    showButton.addEventListener("click", () => {
      dialog.showModal();
      updateScrollbarStyles(true);
    });

    closeButton.addEventListener("click", () => {
      dialog.close();
    });

    dialog.addEventListener("close", () => {
      updateScrollbarStyles(false);
    });

    // Prevent page scroll when a dialog is open
    const updateScrollbarStyles = (isOpen) => {
      const hasOverflow =
        document.documentElement.scrollHeight >
        document.documentElement.clientHeight;

      if (!hasOverflow) return;

      document.documentElement.style.overflow = isOpen ? "hidden" : "";
      document.documentElement.style.scrollbarGutter = isOpen ? "stable" : "";
    };
  </script>
</html>
